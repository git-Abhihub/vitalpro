name: Phase 1 - Project Stabilization

on:
  push:
    branches: [main, phase-1-stabilization]
  pull_request:
    branches: [main]
    paths:
      - "VitalGuard-AI-main/**"
      - ".github/workflows/phase1-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VitalGuard-AI-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VitalGuard-AI-main/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VitalGuard-AI-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: VitalGuard-AI-main/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run API and simulator tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q
